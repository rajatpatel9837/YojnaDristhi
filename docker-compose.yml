version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: yojnasetu-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ml-service:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: yojnasetu-ml-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yojnasetu-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/yojnasetu
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_SECRET=yojnasetu_production_jwt_secret_key_2026_sih
    depends_on:
      - mongodb
      - ml-service

volumes:
  mongo_data:
